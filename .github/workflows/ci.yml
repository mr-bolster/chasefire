name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Not a blocker, a nag. Two READMEs drift the moment one is edited alone, and
  # the English one already spent days claiming MIDI was "still to come" after
  # it shipped. This shouts on the pull request instead of finding out months
  # later that the Spanish one describes a program that no longer exists.
  translations:
    name: Are both READMEs moving together?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare what changed
        run: |
          base="origin/${{ github.base_ref }}"
          changed() { git diff --name-only "$base"...HEAD | grep -qx "$1"; }
          if changed README.md && ! changed README.es.md; then
            echo "::warning file=README.es.md::README.md changed and README.es.md did not."
          fi
          if changed README.es.md && ! changed README.md; then
            echo "::warning file=README.md::README.es.md changed and README.md did not."
          fi

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # cpal talks to ALSA on Linux, and alsa-sys needs its headers to build.
      # Windows and macOS need nothing: WASAPI and CoreAudio come with the
      # system, as do WinMM and CoreMIDI. macOS runs the virtual-MIDI-port
      # tests too — CoreMIDI has them, so the same `#[cfg(unix)]` tests that
      # cover Linux cover it.
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Tests
        run: cargo test --all-features

  windows-build:
    name: Windows binary
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      # The signed, packaged build comes later. This job exists from day one so
      # the Windows target can never quietly rot while development happens on Linux.
      - name: Collect binaries
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem target/release -Filter *.exe | Copy-Item -Destination dist
          Get-ChildItem dist
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: chasefire-windows-x64
          path: dist
          if-no-files-found: ignore
