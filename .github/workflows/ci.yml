name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Tests
        run: cargo test --all-features

  windows-build:
    name: Windows binary
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      # The signed, packaged build comes later. This job exists from day one so
      # the Windows target can never quietly rot while development happens on Linux.
      - name: Collect binaries
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem target/release -Filter *.exe | Copy-Item -Destination dist
          Get-ChildItem dist
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: chasefire-windows-x64
          path: dist
          if-no-files-found: ignore
