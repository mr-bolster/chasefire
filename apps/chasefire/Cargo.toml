[package]
name = "chasefire"
description = "Chasefire: the floating window that runs the show"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ltc = { path = "../../crates/ltc" }
pablo = { path = "../../crates/pablo" }
show = { path = "../../crates/show" }
audio = { path = "../../crates/audio" }
cue = { path = "../../crates/cue" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Default features drag in wgpu, and with it a DirectX 12 dependency stack that
# does not currently build on Windows. This window needs none of it: glow is
# OpenGL, works everywhere, and makes for a smaller binary.
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
png = "0.17"
